[lab]
db_path = "data/novel_lab.db"

[research]
request_timeout = 15
# 番茄 CDN 会拒绝非浏览器 UA，这里用真实浏览器串
user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"

[discovery]
genders = ["男频", "女频"]
rank_types = ["在读榜", "新书榜"]
top_per_board = 10
# 相邻请求间隔，对站点保持礼貌
request_delay_seconds = 0.8
# 起点m站4板块（月票/阅读指数/签约/书友）；起点PC站有JS挑战不绕，qdmm女生网被WAF拦暂不接
qidian_enabled = true

[popularity]
# v3 四维权重（board/rank/velocity/trend，和为 1），与 popularity.py 对齐
board_weight = 0.20
rank_weight = 0.35
velocity_weight = 0.25
trend_weight = 0.20

[llm]
# 本地 sick-cloud 上的 Ollama（qwen3.8:27b-iq3s），经 SSH 隧道转发：
#   ssh -N -L 11434:127.0.0.1:11434 sick-cloud
# 用时开隧道 + enabled=true，用完关闭（2026-10-17 P5 LLM 抽取已验收）。
# think:false 关思考模式，开着思考会超 120s 且塞爆串行队列。
# 2026-10-18：5080 被 vLLM 任务占用时 Ollama 仅剩 ~1GB 显存，27B 掉到
# CPU 上爬（单章>10分钟且超时）。显存空闲时再 enabled=true 跑 extract；
# 已成功章节靠回执复用不会重复推理。
enabled = false
base_url = "http://127.0.0.1:11434/v1"
api_key = "local-ollama"
model = "qwen3.8:27b-iq3s"
timeout_seconds = 900
extra_body = { think = false }
per_minute_limit = 30
per_hour_limit = 3000
per_day_limit = 30000
